# CI, on Windows *and* Linux.
#
# The Linux job is not routine coverage — it is the only thing that makes the
# System V half of the C ABI real. REWRITE-PLAN §6: "Test System V for real. v1's
# is written from the psABI and has never been run. Put a Linux job in CI on day
# one; the classification is the part of a compiler where 'looks right' is worth
# nothing."
#
# So `tests/struct-abi.test.ts` is the job that matters here. It builds a real
# `extern "C"` library with the platform's own C compiler and requires this
# compiler to agree with it about registers, stack slots and hidden return
# pointers.

name: CI

# PARKED, deliberately. Manual-only until the rewrite is done.
#
# This is a two-person project with no pull requests to gate, hosted CI costs
# money, and its security model is worth understanding before granting a runner
# a token rather than after. The System V half will be checked on a real Linux
# machine once milestones 9 and 10 land, which is the point at which the answer
# actually matters.
#
# That check has since been done by hand, on Ubuntu with GCC 15: the whole suite
# passes from a cold checkout and every case in `tests/struct-abi.test.ts` passed
# on the first attempt. The classification was right as written. What the run
# caught was elsewhere — self-assignment released a value before cloning it, on
# every platform, and only glibc was strict enough to say so. NOTES.md, "What the
# first System V run found", has the details.
#
# Which is the argument for turning this back on rather than against it: the
# second platform paid for itself in a bug that was never about the second
# platform.
#
# The file stays because it is the *record* of how to check this, and the note
# below about why the Linux job is not routine coverage is the part worth
# keeping. Turn it back on by restoring the push/pull_request triggers.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Both halves run even when one fails: a Windows failure and a System V
      # failure are different bugs, and seeing only the first wastes a round.
      fail-fast: false
      matrix:
        include:
          - name: windows (Win64 ABI)
            os: windows-latest
          - name: linux (System V ABI)
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The compiler's own crates and the runtime are separate workspaces, and
      # the runtime is rebuilt per target, so both are worth caching.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            packages/runtime/native

      - run: bun install --frozen-lockfile

      # Regenerates the MIR bindings from the Rust definitions, then builds the
      # addon. In that order, so the two halves of the boundary cannot disagree.
      - run: bun run build:backend

      - name: Type-check the compiler
        run: bunx tsc --noEmit

      # Checked rather than left to habit, because a formatter run by hand
      # rewrites whatever it was last pointed at and mixes the churn into
      # whatever change was actually being made. Once it is enforced, `cargo
      # fmt` is always a no-op and never a surprise.
      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Lint the Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      # The runtime is its own workspace and is not covered by the above.
      - name: Lint the runtime
        run: cargo clippy --all-targets -- -D warnings
        working-directory: packages/runtime/native

      # Everything: the language suite, the golden MIR, the C++ oracle, the
      # layout suite and the struct-ABI suite. The last two need CMake, which
      # both runners already have.
      - name: Tests
        run: bun test
